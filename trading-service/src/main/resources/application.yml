spring:
  application:
    name: trading-service
  profiles:
    active: local
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/sixfin?currentSchema=trading_service
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    jpa:
      hibernate:
        ddl-auto: ${JPA_DDL_AUTO:update}
      properties:
        hibernate:
          format_sql: true
      show-sql: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

trading:
  outbox:
    publisher:
      topic: trade-events.v1
      batch-size: 2000
      max-retry: 5
      parallelism: 4
      retry-pause-ms: ${OUTBOX_RETRY_PAUSE_MS:5000}

market:
  clock:
    start-seq: 0
    end-seq: 7393       # recent_20d_high가 NULL 되기 직전. 일봉 보강 시 7783으로 확장
    speed-factor: 1
    cache-refresh-interval-ms: 1000

market-data:
  csv-dir: ${MARKET_DATA_DIR:../tools/market-data-collector/out}

quote:
  reader:
    type: redis

server:
  port: 19093

eureka:
  client:
    service-url:
      defaultZone: http://localhost:19090/eureka/

  instance:
    # 호스트명 대신 IP 주소를 Eureka에 등록
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: http://localhost:9411/api/v1/spans
