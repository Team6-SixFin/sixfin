global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # IntelliJ에서 실행 중인 Learning 서비스의 Actuator 메트릭을 수집한다.
  - job_name: 'learning-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:19094']
