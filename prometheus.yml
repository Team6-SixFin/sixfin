global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AWS에서는 docker-compose.data.yml의 extra_hosts가 sixfin-app을 App EC2 사설 IP로 연결한다.
  # 로컬에서는 host-gateway를 사용하므로 같은 설정을 재사용할 수 있다.
  - job_name: 'learning-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sixfin-app:19094']

  - job_name: 'trading-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['sixfin-app:19093']
