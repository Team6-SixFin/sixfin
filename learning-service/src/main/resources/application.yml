spring:
  application:
    name: learning-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/${POSTGRES_DB:sixfin}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:learning-trade-events-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sparta.learning.infrastructure.messaging.kafka.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sparta.learning.infrastructure.messaging.kafka.dto.TradingEventEnvelope
    # 재시도를 모두 소진한 이벤트를 DLT로 발행할 때만 사용
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    listener:
      ack-mode: record

  ai:
    retry:
      max-attempts: 3 # 최대 재시도 횟수 (최초 1회 + 재시도 2회)
      backoff:
        initial-interval: 2000 # 첫 실패 시 2초 대기 후 재시도
        multiplier: 2 # 대기 시간 증가 배수 (2초 -> 4초)
        max-interval: 10000 # 최대 대기 시간 (10초)
      exclude-on-http-codes: 400, 401, 403, 404 # 클라이언트 잘못인 경우 재시도 안 함
    openai:
      api-key: ${AI_API_KEY}
      base-url: https://generativelanguage.googleapis.com/v1beta/openai/
      chat:
        model: gemini-3.5-flash
        # 프롬프트 지시만 의존하지 않고 Gemini가 JSON 객체로 응답하도록 강제합니다.
        response-format:
          type: JSON_OBJECT

learning:
  kafka:
    topics:
      trade-events: ${TRADE_EVENTS_TOPIC:trade-events.v1}
  resources:
    cache:
      ttl: ${LEARNING_RESOURCE_CACHE_TTL:24h}
      pool-size: ${LEARNING_RESOURCE_CACHE_POOL_SIZE:20}
      recent-recommendation-days: ${LEARNING_RESOURCE_RECENT_DAYS:30}
    freshness:
      video-ttl: ${LEARNING_RESOURCE_VIDEO_TTL:7d}
      document-ttl: ${LEARNING_RESOURCE_DOCUMENT_TTL:30d}
    youtube:
      enabled: ${YOUTUBE_SEARCH_ENABLED:false}
      api-key: ${YOUTUBE_API_KEY:}
      base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com/youtube/v3}
      max-results: ${YOUTUBE_SEARCH_MAX_RESULTS:20}
      relevance-language: ${YOUTUBE_RELEVANCE_LANGUAGE:ko}
      region-code: ${YOUTUBE_REGION_CODE:KR}

server:
  port: ${SERVER_PORT:19094}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:19090/eureka/}
  instance:
    # 호스트명 대신 IP 주소를 Eureka에 등록
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        learning.trade.event.processing.duration: true
        learning.diagnosis.duration: true
        learning.ai.request.duration: true
        learning.feedback.generation.duration: true
        learning.resource.recommendation.duration: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v1/spans}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
