spring:
  application:
    name: learning-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${LEARNING_DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:sixfin}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:learning-trade-events-v1}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.sparta.learning.infrastructure.messaging.kafka.dto
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.sparta.learning.infrastructure.messaging.kafka.dto.TradingEventEnvelope
    listener:
      ack-mode: record

learning:
  kafka:
    topics:
      trade-events: ${TRADE_EVENTS_TOPIC:trade-events.v1}

server:
  port: ${SERVER_PORT:19094}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:19090/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v1/spans}
