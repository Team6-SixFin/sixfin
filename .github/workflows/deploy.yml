name: Deploy to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 21 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew


      - name: Gradle 빌드 (전체 서비스)
        run: ./gradlew build -x test

      - name: AWS 자격증명 설정 (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: ECR 로그인
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: 이미지 빌드 (docker compose)
        env:
          IMAGE_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.app.yml build

      - name: 이미지 push (docker compose)
        env:
          IMAGE_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f docker-compose.app.yml push

      - name: latest 태그도 함께 push
        env:
          IMAGE_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          for svc in eureka-server gateway-service trading-service user-service learning-service; do
            docker tag $IMAGE_REGISTRY/$svc:${{ github.sha }} $IMAGE_REGISTRY/$svc:latest
            docker push $IMAGE_REGISTRY/$svc:latest
          done

      - name: App EC2에 배포 명령 전송 (SSM Send-Command)
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.APP_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "sixfin 배포 (커밋 ${{ github.sha }})" \
            --parameters '{"commands":["cd /home/ec2-user/sixfin","docker compose -f docker-compose.app.yml --env-file .env pull","docker compose -f docker-compose.app.yml --env-file .env up -d"]}' \
            --query "Command.CommandId" \
            --output text)
          echo "COMMAND_ID=$COMMAND_ID" >> $GITHUB_ENV

      - name: 배포 명령 완료 대기
        run: |
          aws ssm wait command-executed \
            --command-id "${{ env.COMMAND_ID }}" \
            --instance-id "${{ secrets.APP_EC2_INSTANCE_ID }}"

      - name: 헬스체크 (Eureka 응답 확인)
        run: |
          sleep 30
          for i in $(seq 1 15); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.APP_EC2_PUBLIC_IP }}:19090/actuator/health || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "헬스체크 성공"
              exit 0
            fi
            echo "재시도 $i/15 (상태: $STATUS)"
            sleep 15
          done
          echo "헬스체크 실패 — 수동 확인 필요"
          exit 1
