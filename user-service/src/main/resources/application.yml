spring:
  application:
    name: user-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${LEARNING_DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:sixfin}}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${SERVER_PORT:19092}

eureka:
   client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:19090/eureka/}

management:
   tracing:
     sampling:
      probability: 1.0
     export:
       zipkin:
         endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v1/spans}

jwt:
  secret: ${JWT_SECRET}
  access-expiration: 1800000 # 30분
  refresh-expiration: 1209600000 # 14일